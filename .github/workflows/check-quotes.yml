name: check-quotes

on:
  push:
    paths: ["legal/**", "scripts/**", ".github/workflows/check-quotes.yml"]
  pull_request:
    paths: ["legal/**", "scripts/**", ".github/workflows/check-quotes.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Testes unitarios (offline, fixtures)
        run: python scripts/test_check_quotes.py -v
      - name: Verificar trechos literais contra o Fedlex (rede)
        run: python scripts/check_quotes.py --report reports/quotes.json
      - name: Subir relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quotes-report
          path: reports/quotes.json
          if-no-files-found: warn
