- id: R-COM-051
  categoria: C-Comportement
  subtema: portar-permis-de-circulation
  regra_pt: "Os condutores devem sempre portar o original do permis de circulation, a menos que lhes tenha sido entregue uma duplicata. Os condutores de veículos a motor agrícolas e florestais não são obrigados a portar o permis de circulation quando fazem trajetos entre a exploração e o território explorado; o mesmo vale para os condutores de reboques dos serviços de bombeiros ou da proteção civil que fazem trajetos no território do município."
  termos_fr: ["porteurs de l'original du permis de circulation"]
  fonte: { lei: OAC, rs: "741.51", artigo: "71", alinea: "5", url: "https://fedlex.data.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/1976/2423_2423_2423/20260101/fr/html/fedlex-data-admin-ch-eli-cc-1976-2423_2423_2423-20260101-fr-html-3.html" }
  trecho_literal_fr: "Les conducteurs doivent toujours être porteurs de l'original du permis de circulation, à moins qu'un duplicata ne leur ait été délivré. Les conducteurs de véhicules automobiles agricoles et forestiers ne sont pas tenus d'être porteurs du permis de circulation lorsqu'ils effectuent des courses entre l'exploitation et le territoire exploité; il en va de même des conducteurs de remorques des services du feu ou de la protection civile qui effectuent des courses sur le territoire de la commune."
  trecho_completo: true
  excecoes:
    - "Regra de outra disposição (não consta desta alínea): LCR 10 al. 4 (R-COM-049): obrigação de portar os permis (permis de conduire) e apresentá-los quando solicitado."
  versao_lei_em_vigor_desde: "2026-01-01"
  verificado_em: "2026-11-26"
  status: pendente
