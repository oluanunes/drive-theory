  status: pendente

- id: R-ARR-065
  categoria: B-Arret-Stationnement
  subtema: marcas-proibicao-parar
  regra_pt: "Antes das faixas de pedestres, uma linha que proíbe parar (« ligne interdisant l'arrêt », amarela, contínua; 6.18), com pelo menos 10 m de comprimento, será marcada paralelamente à borda direita da pista, a uma distância de 50 a 100 cm; ela proíbe a parada voluntária na pista e na calçada adjacente. Nas vias de sentido único, a linha será traçada nas bordas direita e esquerda da pista. Ela não será traçada na superfície das interseções, perto de ciclofaixas, nem nos « créneaux de parcage et d'arrêt » que precedem uma faixa de pedestres."
  termos_fr: ["ligne interdisant l'arrêt (6.18)", "passages pour piétons", "10 m", "trottoir adjacent", "créneaux de parcage et d'arrêt"]
  fonte: { lei: OSR, rs: "741.21", artigo: "77", alinea: "2", url: "https://fedlex.data.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/1979/1961_1961_1961/20261001/fr/html/fedlex-data-admin-ch-eli-cc-1979-1961_1961_1961-20261001-fr-html-2.html" }
  trecho_literal_fr: "Avant les passages pour piétons, une ligne interdisant l'arrêt (jaune, continue; 6.18), d'une longueur d'au moins 10 m, sera marquée parallèlement au bord droit de la chaussée, à une distance de 50 à 100 cm; elle interdit l'arrêt volontaire sur la chaussée et sur le trottoir adjacent. Sur les routes à sens unique, la ligne interdisant l'arrêt sera tracée sur les bords droit et gauche de la chaussée. Elle ne sera pas tracée sur la superficie des intersections, près des bandes cyclables, ainsi que sur les créneaux de parcage et d'arrêt précédant un passage pour piétons."
  trecho_completo: true
  excecoes:
    - "Vias de sentido único: a linha é traçada nas bordas direita e esquerda (OSR 77 al. 2, 2ª frase)."
    - "A linha não é traçada na superfície das interseções, perto de ciclofaixas, nem nos créneaux de parcage et d'arrêt antes da faixa (OSR 77 al. 2, 3ª frase)."
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente
  nota: "O texto pede a linha com mínimo de 10 m; isso é regra de marcação (para a autoridade), não distância para o condutor. A distância do condutor é a da OCR 18 al. 2 let. e (5 m antes da faixa, quando não há linha)."

- id: R-ARR-066
  categoria: B-Arret-Stationnement
  subtema: marcas-vagas
  regra_pt: "As vagas de estacionamento são indicadas exclusivamente por uma marca ou marcadas em complemento da sinalização."
  termos_fr: ["cases de stationnement", "marque"]
  fonte: { lei: OSR, rs: "741.21", artigo: "79", alinea: "1", url: "https://fedlex.data.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/1979/1961_1961_1961/20261001/fr/html/fedlex-data-admin-ch-eli-cc-1979-1961_1961_1961-20261001-fr-html-2.html" }
  trecho_literal_fr: "Les cases de stationnement sont indiquées exclusivement par une marque ou marquées en complément de la signalisation."
  trecho_completo: true
  excecoes: []
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente

- id: R-ARR-067
  categoria: B-Arret-Stationnement
  subtema: marcas-vagas
  regra_pt: "As vagas de estacionamento são delimitadas por linhas contínuas. No lugar das linhas contínuas, pode-se usar uma marcação parcial. As marcas são brancas; para as vagas situadas na « zona azul » (« zone bleue »), são azuis. As vagas brancas ou azuis também podem ser indicadas por um revestimento particular que se distinga claramente da pista."
  termos_fr: ["cases de stationnement", "marques blanches", "zone bleue", "marquage partiel", "revêtement particulier"]
  fonte: { lei: OSR, rs: "741.21", artigo: "79", alinea: "2", url: "https://fedlex.data.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/1979/1961_1961_1961/20261001/fr/html/fedlex-data-admin-ch-eli-cc-1979-1961_1961_1961-20261001-fr-html-2.html" }
  trecho_literal_fr: "Les cases de stationnement sont délimitées par des lignes continues. À la place des lignes continues, on peut utiliser un marquage partiel. Les marques sont blanches; pour les cases situées dans la\"zone bleue\", elles sont bleues. Les cases de stationnement blanches ou bleues peuvent également être indiquées par un revêtement particulier qui se distingue nettement de la chaussée."
  trecho_completo: true
  excecoes: []
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente

- id: R-ARR-068
  categoria: B-Arret-Stationnement
  subtema: marcas-vagas
  regra_pt: "O início e o fim de uma zona azul podem ser indicados pela marca « Double ligne transversale » (de cor branca e azul; 6.24); a linha azul fica do lado interno da zona."
  termos_fr: ["zone bleue", "double ligne transversale (6.24)"]
  fonte: { lei: OSR, rs: "741.21", artigo: "79", alinea: "3", url: "https://fedlex.data.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/1979/1961_1961_1961/20261001/fr/html/fedlex-data-admin-ch-eli-cc-1979-1961_1961_1961-20261001-fr-html-2.html" }
  trecho_literal_fr: "Le début et la fin d'une zone bleue peuvent être indiqués au moyen de la marque\"Double ligne transversale\"(de couleur blanche et bleue; 6.24); la ligne bleue se trouve du côté intérieur de la zone."
  trecho_completo: true
  excecoes: []
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente
  nota: "Não descrevo o desenho além do que o texto diz (cores e posição da linha azul)."

- id: R-ARR-069
  categoria: B-Arret-Stationnement
  subtema: marcas-vagas
  regra_pt: "É possível reservar vagas de estacionamento às categorias de veículos e grupos de usuários seguintes, marcando nelas um símbolo: a) o símbolo « Cycle » (5.31), para ciclos e ciclomotores; b) o símbolo « Motocycle » (5.29), para motocicletas; c) o símbolo « Handicapés » (5.34.4), para as pessoas que dispõem de um cartão de estacionamento para pessoas com deficiência; d) o símbolo « Station de recharge » (5.42), para veículos elétricos em recarga; e) o símbolo « Covoiturage » (5.43), para veículos que transportem, na chegada, um número de pessoas pelo menos igual ao inscrito no símbolo; f) o símbolo « Vélo-cargo » (5.31.1), para ciclos e ciclomotores destinados ao transporte de crianças, passageiros ou coisas, bem como para ciclos e ciclomotores com reboque."
  termos_fr: ["symbole", "Handicapés (5.34.4)", "Station de recharge (5.42)", "Covoiturage (5.43)", "Vélo-cargo (5.31.1)"]
  fonte: { lei: OSR, rs: "741.21", artigo: "79", alinea: "4", url: "https://fedlex.data.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/1979/1961_1961_1961/20261001/fr/html/fedlex-data-admin-ch-eli-cc-1979-1961_1961_1961-20261001-fr-html-2.html" }
  trecho_literal_fr: "Il est possible de réserver des cases de stationnement aux catégories de véhicules et aux groupes d'utilisateurs ci-après en y marquant un symbole: a. le symbole\"Cycle\"(5.31), pour les cycles et les cyclomoteurs; b. le symbole\"Motocycle\"(5.29), pour les motocycles; c. le symbole\"Handicapés\"(5.34.4), pour les personnes qui disposent d'une\"carte de stationnement pour personnes handicapées\"; d. le symbole\"Station de recharge\"(5.42), pour les véhicules électriques en cours de recharge; e. le symbole\"Covoiturage\"(5.43), pour les véhicules transportant, à l'arrivée, un nombre de personnes au moins équivalent à celui inscrit sur le symbole; f. le symbole\"Vélo-cargo\"(5.31.1), pour les cycles et les cyclomoteurs destinés au transport d'enfants, de passagers ou de choses ainsi que pour les cycles et les cyclomoteurs avec remorque."
  trecho_completo: true
  excecoes: []
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente
  nota: "Não descrevo o desenho dos símbolos; o texto só dá número e nome."

- id: R-ARR-070
  categoria: B-Arret-Stationnement
  subtema: marcas-vagas
  regra_pt: "As vagas de estacionamento reservadas a certos grupos de usuários são marcadas em amarelo. As destinadas a ciclos e ciclomotores também podem ser marcadas em amarelo."
  termos_fr: ["cases de stationnement réservées", "marquées en jaune"]
  fonte: { lei: OSR, rs: "741.21", artigo: "79", alinea: "5", url: "https://fedlex.data.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/1979/1961_1961_1961/20261001/fr/html/fedlex-data-admin-ch-eli-cc-1979-1961_1961_1961-20261001-fr-html-2.html" }
  trecho_literal_fr: "Les cases de stationnement réservées à certains groupes d'utilisateurs sont marquées en jaune. Celles pour les cycles et les cyclomoteurs peuvent aussi être marquées en jaune."
  trecho_completo: true
  excecoes: []
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente

- id: R-ARR-071
  categoria: B-Arret-Stationnement
  subtema: marcas-vagas
  regra_pt: "Onde há vagas de estacionamento marcadas, os veículos devem estacionar somente dentro dos limites dessas vagas. As vagas só devem ser usadas pelos veículos das categorias para as quais foram dimensionadas. As vagas reservadas a uma categoria de veículos ou a um grupo de usuários só podem ser usadas por essa categoria ou por esse grupo."
  termos_fr: ["dans les limites de ces cases", "catégories pour lesquelles elles ont été dimensionnées", "groupe d'utilisateurs"]
  fonte: { lei: OSR, rs: "741.21", artigo: "79", alinea: "6", url: "https://fedlex.data.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/1979/1961_1961_1961/20261001/fr/html/fedlex-data-admin-ch-eli-cc-1979-1961_1961_1961-20261001-fr-html-2.html" }
  trecho_literal_fr: "Là où sont marquées des cases de stationnement, les véhicules doivent stationner uniquement dans les limites de ces cases. Les cases de stationnement ne doivent être utilisées que par les véhicules des catégories pour lesquelles elles ont été dimensionnées. Les cases de stationnement réservées à une catégorie de véhicules ou à un groupe d'utilisateurs ne peuvent être utilisées que par celle-ci ou celui-ci."
  trecho_completo: true
  excecoes: []
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente

- id: R-ARR-072
  categoria: B-Arret-Stationnement
  subtema: marcas-proibicao-parar
  regra_pt: "As linhas que proíbem o estacionamento (amarelas, interrompidas por x; 6.22) e as vagas proibidas ao estacionamento (amarelas, com duas diagonais que se cruzam; 6.23), que estão à beira da pista, proíbem estacionar no local marcado. Se a vaga proibida ao estacionamento traz uma inscrição como « Taxi » ou um número de placa de controle, ou os símbolos « Handicapés » (5.34.4), « Station de recharge » (5.42) ou « Véhicules équipés d'un système d'automatisation » (5.44), as paradas para deixar subir ou descer passageiros e para carregar ou descarregar mercadorias só são permitidas se os titulares do direito não forem atrapalhados."
  termos_fr: ["ligne interdisant le parcage (6.22)", "case interdite au parcage (6.23)", "Taxi", "Handicapés (5.34.4)", "Station de recharge (5.42)", "ayants droit"]
  fonte: { lei: OSR, rs: "741.21", artigo: "79a", alinea: "1", url: "https://fedlex.data.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/1979/1961_1961_1961/20261001/fr/html/fedlex-data-admin-ch-eli-cc-1979-1961_1961_1961-20261001-fr-html-2.html" }
  trecho_literal_fr: "Les lignes interdisant le parcage (jaunes, interrompues par des x; 6.22) et les cases interdites au parcage (jaunes avec deux diagonales qui se croisent; 6.23) qui se trouvent sur le bord de la chaussée interdisent de parquer à l'endroit marqué. Si la case interdite au parcage porte une inscription telle que\"Taxi\"ou un numéro de plaque de contrôle, ou les symboles\"Handicapés\"(5.34.4),\"Station de recharge\"(5.42) ou\"Véhicules équipés d'un système d'automatisation\"(5.44), les arrêts servant à laisser monter ou descendre des passagers ainsi qu'à charger ou décharger des marchandises ne sont autorisés que si les ayants droit n'en sont pas gênés."
  trecho_completo: true
  excecoes:
    - "Se a vaga proibida ao estacionamento traz inscrição (como « Taxi » ou número de placa) ou os símbolos 5.34.4, 5.42 ou 5.44: parar para subir/descer passageiros ou carregar/descarregar só é permitido se os titulares do direito não forem atrapalhados (OSR 79a al. 1, 2ª frase)."
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente
  nota: "O texto dá as cores/desenho dessas marcas entre parênteses (amarelo, x, diagonais); reproduzo apenas o que o texto diz."

- id: R-ARR-073
