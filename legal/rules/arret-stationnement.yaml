- id: R-ARR-064
  categoria: B-Arret-Stationnement
  subtema: vagas-recarga-carona
  regra_pt: "A placa complementar com o símbolo « Covoiturage » (5.43), acrescentada aos sinais « Parcage autorisé » (4.17), « Parcage avec disque de stationnement » (4.18) e « Parcage contre paiement » (4.20), indica que a superfície em questão só pode ser usada por veículos que transportem, na chegada, um número de pessoas pelo menos igual ao inscrito no símbolo."
  termos_fr: ["Covoiturage (5.43)", "nombre de personnes"]
  fonte: { lei: OSR, rs: "741.21", artigo: "65", alinea: "15", url: "https://fedlex.data.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/1979/1961_1961_1961/20261001/fr/html/fedlex-data-admin-ch-eli-cc-1979-1961_1961_1961-20261001-fr-html-2.html" }
  trecho_literal_fr: "La plaque complémentaire avec le symbole\"Covoiturage\"(5.43) ajoutée aux signaux\"Parcage autorisé\"(4.17),\"Parcage avec disque de stationnement\"(4.18) et\"Parcage contre paiement\"(4.20) indique que la surface concernée ne peut être utilisée que par des véhicules transportant, à l'arrivée, un nombre de personnes au moins équivalent à celui inscrit sur le symbole."
  trecho_completo: true
