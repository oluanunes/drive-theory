- id: R-ARR-074
  categoria: B-Arret-Stationnement
  subtema: marcas-proibicao-parar
  regra_pt: "As linhas em zigue-zague (amarelas; 6.21) designam os locais reservados às paradas dos transportes públicos de linha. Nesses locais, parar só é permitido para que passageiros subam no veículo ou desçam dele, desde que os veículos do transporte público de linha não sejam atrapalhados."
  termos_fr: ["lignes en zigzag (jaunes; 6.21)", "transports publics en trafic de ligne", "monter dans le véhicule ou en descendre"]
  fonte: { lei: OSR, rs: "741.21", artigo: "79a", alinea: "3", url: "https://fedlex.data.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/1979/1961_1961_1961/20261001/fr/html/fedlex-data-admin-ch-eli-cc-1979-1961_1961_1961-20261001-fr-html-2.html" }
  trecho_literal_fr: "Les lignes en zigzag (jaunes; 6.21) désignent les emplacements réservés aux arrêts des transports publics en trafic de ligne. Sur ces emplacements, l'arrêt n'est autorisé que pour permettre à des passagers de monter dans le véhicule ou d'en descendre, dans la mesure où les véhicules des transports publics en trafic de ligne n'en sont pas gênés."
  trecho_completo: true
  excecoes:
    - "Regra de outra disposição (não consta desta alínea): OCR 18 al. 3: a menos de 10 m das placas de parada do transporte público, parar só para embarque/desembarque (R-ARR-007)."
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente
