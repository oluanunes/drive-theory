  trecho_literal_fr: "La plaque complémentaire\"autorisée\"ajoutée au signal\"Interdiction de parquer\"(2.50) indique que la surface concernée peut être utilisée pour la recharge de véhicules à propulsion électrique."
  trecho_completo: true
