  regra_pt: "Quem vai entrar na circulação, fazer retorno ou dar ré não pode atrapalhar os outros usuários da via; os outros têm prioridade."
  termos_fr: ["engager son véhicule dans la circulation", "demi-tour", "marche arrière", "entraver les autres usagers de la route"]
  fonte: { lei: LCR, rs: "741.01", artigo: "36", alinea: "4", url: "https://juriup.ch/lois/lcr/titre-3/" }
  fonte_tipo: secundaria_juriup_citando_fedlex
  trecho_literal_fr: "Le conducteur qui veut engager son véhicule dans la circulation, faire demi-tour ou marche arrière"
  trecho_completo: false
  trechos_adicionais_fr:
    - "ne doit pas entraver les autres usagers de la route; ces derniers bénéficient de la priorité."
  excecoes: []
