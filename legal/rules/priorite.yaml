# T-003 PESQ — categoria D (Priorité). Todas as regras: status pendente.
# Fontes abertas em 2026-11-26:
#   OCR (RS 741.11) PDF oficial admin.ch, "État le 1er octobre 2026"
#   OSR (RS 741.21) PDF oficial admin.ch, "État le 1er octobre 2026"
#   LCR (RS 741.01) SO via juriup.ch (secundária, cita Fedlex, "en vigueur au 1er juillet 2026" p/ art. 26-57b). Fedlex direto NÃO abriu (fora da allowlist do WebFetch).
# Limitação: o extrator só devolve citações curtas (~125 caracteres). Por isso a maioria dos trechos é parcial (trecho_completo: false).
# versao_lei_em_vigor_desde = data "État le" do texto consolidado lido (NÃO é a data de entrada em vigor do artigo).
rules:

- id: R-PRIO-001
  categoria: D-Priorite
  subtema: priorite-de-droite
  regra_pt: "Em cruzamentos, quem vem da direita tem prioridade. Mas quem está numa via sinalizada como principal mantém a prioridade, mesmo vindo da esquerda. Sinal ou ordem da polícia diferente da regra geral vale mais que ela."
  termos_fr: ["priorité de droite", "le véhicule qui vient de droite", "route signalée comme principale"]
  fonte: { lei: LCR, rs: "741.01", artigo: "36", alinea: "2", url: "https://juriup.ch/lois/lcr/titre-3/" }
  fonte_tipo: secundaria_juriup_citando_fedlex
  trecho_literal_fr: "Aux intersections, le véhicule qui vient de droite a la priorité. Les véhicules circulant sur une route signalée comme principale ont la priorité, même s’ils viennent de gauche. Est réservée toute réglementation différente de la circulation imposée par des signaux ou par la police."
  trecho_completo: true
  excecoes:
    - "Regulação diferente imposta por sinais ou pela polícia (LCR 36 al. 2, última frase)."
    - "Via sinalizada como principal: tem prioridade mesmo vindo da esquerda (LCR 36 al. 2)."
    - "Saída de propriedade, pátio, garagem, caminho rural, ciclovia etc.: quem sai cede a quem está na via (OCR 15 al. 3, ver R-PRIO-017)."
    - "Vias com Stop/Cédez le passage que desembocam numa via prioritária no mesmo ponto: entre si aplicam a regra da direita (OCR 15 al. 2, ver R-PRIO-016)."
    - "Via principal que muda de direção: quem sai dela só cede ao tráfego em sentido contrário (OCR 15 al. 1, ver R-PRIO-015)."
  versao_lei_em_vigor_desde: "2026-07-01"
  verificado_em: "2026-11-26"
  status: pendente
  nota: "Texto vindo de juriup.ch (secundária). Reabrir no Fedlex e comparar antes de validar. Observação: a página juriup mostra al. 2 sem a subdivisão em letras; confirmar no Fedlex."

- id: R-PRIO-002
  categoria: D-Priorite
  subtema: via-principal
  regra_pt: "O sinal 'Route principale' marca as vias que têm prioridade. Quem circula nelas é informado de que tem prioridade."
  termos_fr: ["route principale", "signal Route principale (3.03)", "routes prioritaires"]
  fonte: { lei: OSR, rs: "741.21", artigo: "37", alinea: "1", url: "https://res.cloudinary.com/adminch/image/private/s--3YdiC6d9--/v1752031725/Bundespublikationen/741-21f.pdf" }
  trecho_literal_fr: "Le signal «Route principale» (3.03) désigne les routes prioritaires et indique au conducteur"
  trecho_completo: false
  excecoes: []
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente
  nota: "Trecho cortado; fim da frase do al. 1 não lido. regra_pt só afirma a parte lida. Art. 37 al. 2-4 (colocação do sinal, rotas que mudam de direção -> art. 65 al. 1, rotas nacionais) apenas vistos em fragmentos: não usados."

- id: R-PRIO-003
  categoria: D-Priorite
  subtema: via-principal
  regra_pt: "O sinal 'Fin de la route principale' avisa que a via perde a prioridade e que passa a valer a regra da direita (texto do artigo cortado depois de 'priorité de droite')."
  termos_fr: ["fin de la route principale", "signal 3.04", "priorité de droite"]
  fonte: { lei: OSR, rs: "741.21", artigo: "38", alinea: "1", url: "https://res.cloudinary.com/adminch/image/private/s--3YdiC6d9--/v1752031725/Bundespublikationen/741-21f.pdf" }
  trecho_literal_fr: "Le signal «Fin de la route principale» (3.04) indique que la route perd sa priorité et que la priorité de droite"
  trecho_completo: false
  excecoes: []
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente
  nota: "Trecho cortado no fim da frase; ler o artigo inteiro antes de validar. Se houver outro sinal de prioridade logo depois do cruzamento, não foi lido."

- id: R-PRIO-004
  categoria: D-Priorite
  subtema: sinais-de-prioridade
  regra_pt: "Os sinais de prioridade avisam o condutor de que ele deve dar prioridade a outros veículos. Podem ter forma de sinal de perigo, de prescrição ou de indicação."
  termos_fr: ["signaux de priorité", "accorder la priorité"]
  fonte: { lei: OSR, rs: "741.21", artigo: "35", alinea: "1-2", url: "https://res.cloudinary.com/adminch/image/private/s--3YdiC6d9--/v1752031725/Bundespublikationen/741-21f.pdf" }
  trecho_literal_fr: "Les signaux de priorité annoncent au conducteur qu’il doit accorder la priorité aux autres véhicules"
  trecho_completo: false
  trechos_adicionais_fr:
    - "Les signaux de priorité ont la forme des signaux de danger, des signaux de prescription ou d’indication"
  excecoes: []
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente
  nota: "Al. 1 e al. 2 só em fragmentos. A frase de al. 1 aparece cortada; o 'annoncent' pode se referir a 'annoncent au conducteur ... accorder la priorité aux autres véhicules' com complemento não lido."

- id: R-PRIO-005
  categoria: D-Priorite
  subtema: stop
  regra_pt: "O sinal Stop obriga a parar e dar prioridade aos veículos (da via em que se entra; complemento do texto não lido)."
  termos_fr: ["signal Stop (3.01)", "s'arrêter", "accorder la priorité"]
  fonte: { lei: OSR, rs: "741.21", artigo: "36", alinea: "1", url: "https://res.cloudinary.com/adminch/image/private/s--3YdiC6d9--/v1752031725/Bundespublikationen/741-21f.pdf" }
  trecho_literal_fr: "Le signal «Stop» (3.01) oblige le conducteur à s’arrêter et à accorder la priorité aux véhicules"
  trecho_completo: false
  excecoes:
    - "Em cruzamentos com semáforo, o al. 3 limita quando os sinais devem ser observados (texto cortado, ver R-PRIO-007)."
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente
  nota: "Trecho cortado; o complemento (a quais veículos cede) não foi lido. Art. 36 al. 7: Stop só onde parada é indispensável (parcial, ver fragmentos)."

- id: R-PRIO-006
  categoria: D-Priorite
  subtema: cedez-le-passage
  regra_pt: "O sinal Cédez le passage obriga a dar prioridade aos veículos (da via em que se entra; complemento do texto não lido). Diferente do Stop, o texto lido não diz que é preciso parar sempre; só parar se necessário (regra geral do OCR 14 al. 1, ver R-PRIO-011)."
  termos_fr: ["signal Cédez le passage (3.02)", "accorder la priorité"]
  fonte: { lei: OSR, rs: "741.21", artigo: "36", alinea: "2", url: "https://res.cloudinary.com/adminch/image/private/s--3YdiC6d9--/v1752031725/Bundespublikationen/741-21f.pdf" }
  trecho_literal_fr: "Le signal «Cédez le passage» (3.02) oblige le conducteur à accorder la priorité aux véhicules"
  trecho_completo: false
  excecoes:
    - "Em cruzamentos com semáforo, o al. 3 limita quando os sinais devem ser observados (ver R-PRIO-007)."
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente
  nota: "Trecho cortado. A segunda frase da regra_pt é inferência pedagógica a partir do contraste com al. 1; revisar."

- id: R-PRIO-007
  categoria: D-Priorite
  subtema: sinais-vs-semaforo
  regra_pt: "Em cruzamentos com semáforo existe uma regra especial sobre quando os sinais Stop/Cédez le passage devem ser observados. O texto lido está cortado, então o conteúdo exato precisa ser conferido."
  termos_fr: ["installation de signaux lumineux", "signaux"]
  fonte: { lei: OSR, rs: "741.21", artigo: "36", alinea: "3", url: "https://res.cloudinary.com/adminch/image/private/s--3YdiC6d9--/v1752031725/Bundespublikationen/741-21f.pdf" }
  trecho_literal_fr: "Aux intersections munies d’une installation de signaux lumineux, il ne faut observer les signaux"
  trecho_completo: false
  excecoes: []
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente
  nota: "Trecho cortado antes do fim da condição ('il ne faut observer les signaux ...'). NÃO afirmar quando (ex.: semáforo apagado/amarelo piscante) até ler o artigo completo."

- id: R-PRIO-008
  categoria: D-Priorite
  subtema: sinal-prioridade-de-direita
  regra_pt: "Em vias secundárias, o sinal 'Intersection comportant la priorité de droite' anuncia um cruzamento onde vale a regra da direita. O sinal só é colocado em casos limitados (por ex. quando o condutor não consegue ver a tempo a via que vem da direita)."
  termos_fr: ["intersection comportant la priorité de droite", "signal 3.06", "routes secondaires"]
  fonte: { lei: OSR, rs: "741.21", artigo: "40", alinea: "1-2", url: "https://res.cloudinary.com/adminch/image/private/s--3YdiC6d9--/v1752031725/Bundespublikationen/741-21f.pdf" }
  trecho_literal_fr: "Le signal «Intersection comportant la priorité de droite» (3.06) annonce, sur les routes secondaires, une intersection"
  trecho_completo: false
  trechos_adicionais_fr:
    - "si le conducteur n’a pas la possibilité d’apercevoir à temps la route qui débouche de droite;"
    - "si une intersection où s’applique la priorité de droite prévue par la loi succède à plusieurs intersections"
  excecoes: []
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente
  nota: "Al. 2 lista condições (let. a, b) só em fragmentos; pode haver outras. regra_pt só reflete let. a e b parcialmente."

- id: R-PRIO-009
  categoria: D-Priorite
  subtema: sinal-intersecao-via-sem-prioridade
  regra_pt: "O sinal 'Intersection avec une route sans priorité' informa quem anda em vias secundárias de que há um cruzamento com via sem prioridade. Dentro de localidades não é preciso colocá-lo."
  termos_fr: ["intersection avec une route sans priorité", "signal 3.05", "à l’intérieur des localités"]
  fonte: { lei: OSR, rs: "741.21", artigo: "39", alinea: "1-2", url: "https://res.cloudinary.com/adminch/image/private/s--3YdiC6d9--/v1752031725/Bundespublikationen/741-21f.pdf" }
  trecho_literal_fr: "Le signal «Intersection avec une route sans priorité» (3.05) indique au conducteur circulant sur des routes secondaires"
  trecho_completo: false
  trechos_adicionais_fr:
    - "À l’intérieur des localités, il n’est pas nécessaire de placer le signal «Intersection avec une route sans priorité»"
  excecoes:
    - "Dentro das localidades o sinal não precisa ser colocado (al. 2)."
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente
  nota: "Al. 1 cortado; o que o sinal indica exatamente não foi lido por inteiro. Cuidado: 'não precisa colocar o sinal' não significa que a prioridade muda."

- id: R-PRIO-010
  categoria: D-Priorite
  subtema: sinal-estreitamento
  regra_pt: "Em estreitamentos, dois sinais regulam quem passa primeiro: um obriga a deixar passar os veículos em sentido contrário; o outro indica prioridade em relação a eles."
  termos_fr: ["laissez passer les véhicules venant en sens inverse", "priorité par rapport aux véhicules venant en sens inverse", "signaux 3.09 et 3.10"]
  fonte: { lei: OSR, rs: "741.21", artigo: "42", alinea: "1-2", url: "https://res.cloudinary.com/adminch/image/private/s--3YdiC6d9--/v1752031725/Bundespublikationen/741-21f.pdf" }
  trecho_literal_fr: "Le signal «Laissez passer les véhicules venant en sens inverse» (3.09) oblige le conducteur circulant"
  trecho_completo: false
  trechos_adicionais_fr:
    - "Le signal «Priorité par rapport aux véhicules venant en sens inverse» (3.10) indique au conducteur"
  excecoes: []
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente
  nota: "Só a abertura dos dois alíneas foi lida. Condições (ex.: onde a pista se estreita) não lidas."

- id: R-PRIO-011
  categoria: D-Priorite
  subtema: exercicio-da-prioridade
  regra_pt: "Quem tem de dar prioridade não pode atrapalhar quem tem prioridade: deve reduzir a velocidade a tempo e, se precisar esperar, parar antes do cruzamento."
  termos_fr: ["exercice du droit de priorité", "celui qui est tenu d’accorder la priorité", "gêner"]
  fonte: { lei: OCR, rs: "741.11", artigo: "14", alinea: "1", url: "https://res.cloudinary.com/adminch/image/private/s--wlKhk8kZ--/v1752031602/Bundespublikationen/741-11f.pdf" }
  trecho_literal_fr: "Celui qui est tenu d’accorder la priorité ne doit pas gêner dans sa marche le conducteur bénéficiaire de la priorité."
  trecho_completo: false
  excecoes: []
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente
  nota: "A primeira frase é literal; a parte sobre reduzir a tempo e parar antes do cruzamento foi lida só como paráfrase do extrator (segunda frase do al. 1, texto literal não obtido)."

- id: R-PRIO-012
  categoria: D-Priorite
  subtema: exercicio-da-prioridade
  regra_pt: "Quem tem prioridade também deve ter cuidado com quem já chegou ao cruzamento antes, mesmo que ainda não o tivesse visto."
  termos_fr: ["bénéficiaire de la priorité", "usagers de la route qui ont atteint l’intersection"]
  fonte: { lei: OCR, rs: "741.11", artigo: "14", alinea: "2", url: "https://res.cloudinary.com/adminch/image/private/s--wlKhk8kZ--/v1752031602/Bundespublikationen/741-11f.pdf" }
  trecho_literal_fr: "Le bénéficiaire de la priorité aura égard aux usagers de la route qui ont atteint l’intersection"
  trecho_completo: false
  excecoes: []
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente
  nota: "Fim da frase ('avant ... avoir aperçu son véhicule', segundo o extrator) não copiado literalmente."

- id: R-PRIO-013
  categoria: D-Priorite
  subtema: exercicio-da-prioridade
  regra_pt: "Quando há filas paralelas com prioridade, a prioridade deve ser respeitada, mesmo se a fila mais próxima estiver parada."
  termos_fr: ["files parallèles", "priorité"]
  fonte: { lei: OCR, rs: "741.11", artigo: "14", alinea: "3", url: "https://res.cloudinary.com/adminch/image/private/s--wlKhk8kZ--/v1752031602/Bundespublikationen/741-11f.pdf" }
  trecho_literal_fr: "Lorsque des véhicules circulant en files parallèles ont la priorité, cette dernière doit être respectée."
  trecho_completo: false
  excecoes: []
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente
  nota: "Frase literal; o extrator sinalizou continuação (fila próxima parada) como paráfrase."

- id: R-PRIO-014
  categoria: D-Priorite
  subtema: casos-sem-regra
  regra_pt: "Onde nenhuma regra resolve a situação (por exemplo, chegada ao mesmo tempo de todas as direções), os condutores devem ter atenção especial e combinar entre si quem passa primeiro."
  termos_fr: ["régler entre eux l’ordre de priorité", "particulièrement attention"]
  fonte: { lei: OCR, rs: "741.11", artigo: "14", alinea: "5", url: "https://res.cloudinary.com/adminch/image/private/s--wlKhk8kZ--/v1752031602/Bundespublikationen/741-11f.pdf" }
  trecho_literal_fr: "Les conducteurs feront particulièrement attention et régleront entre eux l’ordre de priorité"
  trecho_completo: false
  excecoes: []
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente
  nota: "Condição ('là où aucune règle ...') lida só via paráfrase do extrator. Al. 4 (cavaleiros e condutores de animais grandes equiparados a condutores): só início lido, não gerou regra própria."

- id: R-PRIO-015
  categoria: D-Priorite
  subtema: via-principal-que-muda-de-direcao
  regra_pt: "Se a via principal faz uma curva no cruzamento, quem sai dela só precisa dar prioridade ao tráfego em sentido contrário."
  termos_fr: ["route principale qui change de direction", "véhicules circulant en sens inverse"]
  fonte: { lei: OCR, rs: "741.11", artigo: "15", alinea: "1", url: "https://res.cloudinary.com/adminch/image/private/s--wlKhk8kZ--/v1752031602/Bundespublikationen/741-11f.pdf" }
  trecho_literal_fr: "le conducteur sortant de la route principale doit accorder la priorité seulement aux véhicules circulant en sens inverse"
  trecho_completo: false
  excecoes: []
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente
  nota: "Começo do al. 1 (condição: via principal que muda de direção) não copiado literalmente."

- id: R-PRIO-016
  categoria: D-Priorite
  subtema: vias-secundarias-no-mesmo-ponto
  regra_pt: "Quando duas ou mais vias com Stop ou Cédez le passage encontram uma via prioritária no mesmo ponto, os usuários dessas vias aplicam entre si a regra da direita."
  termos_fr: ["priorité dans des cas particuliers", "Stop", "Cédez le passage", "priorité de droite"]
  fonte: { lei: OCR, rs: "741.11", artigo: "15", alinea: "2", url: "https://res.cloudinary.com/adminch/image/private/s--wlKhk8kZ--/v1752031602/Bundespublikationen/741-11f.pdf" }
  trecho_literal_fr: ""
  trecho_completo: false
  excecoes: []
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente
  nota: "Conteúdo lido só como paráfrase do extrator (al. 2); sem citação literal obtida. Reabrir PDF/Fedlex e copiar o texto."

- id: R-PRIO-017
  categoria: D-Priorite
  subtema: saida-de-propriedade
  regra_pt: "Quem sai de fábrica, pátio, garagem, caminho rural, ciclovia e lugares parecidos deve dar prioridade a quem usa a via. Se não há visibilidade, deve parar e, se preciso, pedir ajuda de uma pessoa para vigiar a manobra."
  termos_fr: ["sortant d’une fabrique, d’une cour, d’un garage, d’un chemin rural, d’une piste cyclable", "accorder la priorité aux usagers de cette route"]
  fonte: { lei: OCR, rs: "741.11", artigo: "15", alinea: "3", url: "https://res.cloudinary.com/adminch/image/private/s--wlKhk8kZ--/v1752031602/Bundespublikationen/741-11f.pdf" }
  trecho_literal_fr: "Celui qui, sortant d'une fabrique, d'une cour, d'un garage, d'un chemin rural, d'une piste cyclable,"
  trecho_completo: false
  trechos_adicionais_fr:
    - "est tenu d'accorder la priorité aux usagers de cette route."
    - "Si l'endroit est sans visibilité, le conducteur doit s'arrêter"
    - "au besoin, il doit avoir recours à l'aide d'une tierce personne, qui surveillera la manœuvre."
  excecoes:
    - "A priorité de droite (LCR 36 al. 2) não vale para quem sai desses lugares: ele cede à via."
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente
  nota: "Lista de locais lida só até 'piste cyclable,' (lista continua: curriculo cita estacionamento, posto, calçada; não confirmado literalmente). Fragmentos separados são citações contíguas do extrator, não necessariamente adjacentes no texto. Chemin de terre = 'chemin rural' no texto lido."

- id: R-PRIO-018
  categoria: D-Priorite
  subtema: rotatoria
  regra_pt: "Ao se aproximar de uma rotatória, reduza a velocidade e dê prioridade aos veículos que vêm pela sua esquerda dentro da rotatória."
  termos_fr: ["carrefour à sens giratoire", "giratoire", "accorder la priorité aux véhicules qui, sur sa gauche"]
  fonte: { lei: OCR, rs: "741.11", artigo: "41b", alinea: "1", url: "https://res.cloudinary.com/adminch/image/private/s--wlKhk8kZ--/v1752031602/Bundespublikationen/741-11f.pdf" }
  trecho_literal_fr: "accorder la priorité aux véhicules qui, sur sa gauche, surviennent dans le giratoire."
  trecho_completo: false
  excecoes: []
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente
  nota: "Só o final da frase foi citado; 'reduzir a velocidade' veio como paráfrase do extrator."

- id: R-PRIO-019
  categoria: D-Priorite
  subtema: rotatoria
  regra_pt: "Não é preciso sinalizar a direção ao entrar na rotatória nem ao continuar na mesma faixa dentro dela, mas a intenção de sair deve ser indicada."
  termos_fr: ["carrefour à sens giratoire", "indiquer la direction"]
  fonte: { lei: OCR, rs: "741.11", artigo: "41b", alinea: "2", url: "https://res.cloudinary.com/adminch/image/private/s--wlKhk8kZ--/v1752031602/Bundespublikationen/741-11f.pdf" }
  trecho_literal_fr: ""
  trecho_completo: false
  excecoes: []
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente
  nota: "Nenhuma citação literal obtida nesta sessão (só paráfrase do extrator). Al. 3 (ciclistas) não lido por mim."

- id: R-PRIO-020
  categoria: D-Priorite
  subtema: pedestres-passagem-nao-regulada
  regra_pt: "Antes de uma faixa de pedestres sem semáforo, reduza e, se preciso, pare. Quem já está na faixa tem prioridade."
  termos_fr: ["passage pour piétons", "trafic non réglé", "piéton déjà engagé sur le passage"]
  fonte: { lei: OCR, rs: "741.11", artigo: "6", alinea: "1", url: "https://res.cloudinary.com/adminch/image/private/s--wlKhk8kZ--/v1752031602/Bundespublikationen/741-11f.pdf" }
  trecho_literal_fr: "accordera la priorité à tout piéton ou utilisateur d’un engin assimilé à un véhicule qui est déjà engagé sur le passage."
  trecho_completo: false
  excecoes: []
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente
  nota: "Início da frase e a parte sobre reduzir/parar vieram como paráfrase. CURRICULO cita também pedestre que 'espera visivelmente' (não reconfirmado nesta leitura)."

- id: R-PRIO-021
  categoria: D-Priorite
  subtema: pedestres-cruzamento-regulado
  regra_pt: "Em cruzamentos com semáforo ou agente, quem vira deve dar prioridade aos pedestres que atravessam a via em que entra."
  termos_fr: ["intersections où le trafic est réglé", "conducteurs qui obliquent", "piétons"]
  fonte: { lei: OCR, rs: "741.11", artigo: "6", alinea: "2", url: "https://res.cloudinary.com/adminch/image/private/s--wlKhk8kZ--/v1752031602/Bundespublikationen/741-11f.pdf" }
  trecho_literal_fr: "Aux intersections où le trafic est réglé, les conducteurs qui obliquent sont tenus d’accorder la priorité aux piétons."
  trecho_completo: false
  excecoes:
    - "Não se aplica com seta verde sem amarelo piscante (segundo o extrator; texto literal da exceção não copiado)."
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente
  nota: "Frase literal copiada; resto do al. 2 (via transversal e exceção da seta verde) só em paráfrase."

- id: R-PRIO-022
  categoria: D-Priorite
  subtema: pedestres-passagem-nao-regulada
  regra_pt: "Na faixa de pedestres sem regulação, o pedestre tem prioridade, exceto sobre bonde/tram e veículos sobre trilhos. O pedestre não pode exigir a prioridade se o veículo já está perto demais para parar a tempo."
  termos_fr: ["passages pour piétons où le trafic n’est pas réglé", "les piétons ont la priorité", "tramways"]
  fonte: { lei: OCR, rs: "741.11", artigo: "47", alinea: "2", url: "https://res.cloudinary.com/adminch/image/private/s--wlKhk8kZ--/v1752031602/Bundespublikationen/741-11f.pdf" }
  trecho_literal_fr: "Sur les passages pour piétons où le trafic n’est pas réglé, les piétons ont la priorité"
  trecho_completo: false
  excecoes:
    - "Tram e veículos sobre trilhos (chemins de fer routiers): pedestre não tem prioridade sobre eles (paráfrase do extrator)."
    - "Pedestre não pode reivindicar a prioridade se o veículo está tão perto que não consegue parar a tempo (paráfrase do extrator)."
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente
  nota: "Citação do extrator foi truncada; exceções só em paráfrase."

