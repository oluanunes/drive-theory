- id: R-PRIO-025
  categoria: D-Priorite
  subtema: tram
  regra_pt: "Condutores de tram devem dar prioridade a veículos dos bombeiros (feu bleu) e também devem dar prioridade ao entrar numa via principal vindo de via secundária."
  termos_fr: ["tramways et chemins de fer routiers", "véhicules du service du feu", "route secondaire", "route principale"]
  fonte: { lei: OCR, rs: "741.11", artigo: "45", alinea: "2", url: "https://res.cloudinary.com/adminch/image/private/s--wlKhk8kZ--/v1752031602/Bundespublikationen/741-11f.pdf" }
  trecho_literal_fr: "En débouchant d'une route secondaire sur une route principale, ils sont tenus d'accorder la priorité."
  trecho_completo: false
  trechos_adicionais_fr:
    - "Ils céderont la priorité aux véhicules du service du feu"
  excecoes: []
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente
  nota: "Os dois trechos são citações separadas do mesmo al. 2; ordem e texto intermediário não conferidos. A lista de veículos prioritários no trecho 1 está cortada ('du service du feu' ... outros não lidos)."

- id: R-PRIO-026
  categoria: D-Priorite
  subtema: onibus-saindo-de-parada
  regra_pt: "Dentro de localidades, quando um ônibus de linha sai de uma parada sinalizada e liga a seta, os veículos que vêm atrás devem, se necessário, reduzir ou parar. O motorista do ônibus só liga a seta quando está pronto para sair e deve esperar se quem vem atrás não conseguiria parar a tempo."
  termos_fr: ["bus en trafic de ligne", "arrêt signalé", "clignoteurs de direction", "réduire leur vitesse ou s’arrêter"]
  fonte: { lei: OCR, rs: "741.11", artigo: "17", alinea: "5", url: "https://res.cloudinary.com/adminch/image/private/s--wlKhk8kZ--/v1752031602/Bundespublikationen/741-11f.pdf" }
  trecho_literal_fr: "Lorsque, à l'intérieur d'une localité, le conducteur d'un bus en trafic de ligne se trouve à un arrêt signalé comme tel"
  trecho_completo: false
  trechos_adicionais_fr:
    - "les conducteurs de véhicules qui arrivent derrière lui doivent au besoin réduire leur vitesse ou s'arrêter"
    - "cette règle n'est pas applicable lorsque l'arrêt se trouve au bord gauche de la chaussée."
    - "Le conducteur de bus ne doit actionner ses clignoteurs de direction qu'au moment où il est prêt à partir;"
    - "il est tenu d'attendre lorsque des véhicules qui arrivent derrière lui ne pourraient pas s'arrêter à temps."
  excecoes:
    - "Não se aplica quando a parada fica no lado esquerdo da via (al. 5)."
    - "Ônibus deve esperar se os veículos de trás não conseguem parar a tempo (al. 5)."
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente
  nota: "IMPORTANTE: a regra do ônibus saindo de parada está no OCR art. 17 al. 5, NÃO no LCR art. 36 al. 4 (ver R-PRIO-030). Fragmentos são citações do extrator em sequência, não necessariamente adjacentes. Conflito com hipótese do briefing registrado."

- id: R-PRIO-027
  categoria: D-Priorite
  subtema: veiculos-prioritarios
  regra_pt: "Veículos de bombeiros, saúde, polícia e alfândega anunciados com luz azul e sirene de dois sons alternados têm prioridade sobre todos, mesmo onde o trânsito é regulado por semáforos."
  termos_fr: ["véhicules prioritaires", "feu bleu", "avertisseur à deux sons alternés", "service du feu", "service de santé", "police", "douane"]
  fonte: { lei: OCR, rs: "741.11", artigo: "16", alinea: "1", url: "https://res.cloudinary.com/adminch/image/private/s--wlKhk8kZ--/v1752031602/Bundespublikationen/741-11f.pdf" }
  trecho_literal_fr: "Les véhicules du service du feu, du service de santé, de la police et de la douane qui sont annoncés par le feu bleu"
  trecho_completo: false
  trechos_adicionais_fr:
    - "et leur avertisseur à deux sons alternés ont la priorité sur tous les usagers de la route,"
    - "même aux endroits où la circulation est réglée par des signaux lumineux."
  excecoes: []
  versao_lei_em_vigor_desde: "2026-10-01"
  verificado_em: "2026-11-26"
  status: pendente
  nota: "Texto oficial diz 'deux sons alternés' (não 'deux tons alternés'). Fragmentos são citações consecutivas; parece o al. 1 inteiro, mas não confirmado. Al. 3-4 (uso restrito a viagens urgentes) não lidos nesta leitura. Os outros usuários devem ceder passagem: dever correspondente (OCR art. 17? / LCR art. 27) NÃO aberto."

