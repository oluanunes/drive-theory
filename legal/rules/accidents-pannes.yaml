  validado_por: "validado por Claude, delegado por Luan em 2026-11-26 (sem revisão humana; Luan confere pelo app)"
  nota: "NUMERAÇÃO NÃO CONFIRMADA: 7.º parágrafo do OSR 62 por posição. O anexo só diz « (art. 62) ». A contagem por posição falha no OSR 68 e no OSR 70 (remissões do próprio OSR), e o parágrafo depois de uma lista a./b. pode pertencer à alínea da lista. Confirmar no HTML do Fedlex; no app, mostrar 'OSR 62'. Os valores 50 m e 1 a 1,5 m estão no texto."

