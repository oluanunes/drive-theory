  trecho_literal_fr: "Le signal\"Direction et distance vers l'issue de secours la plus proche\"(4.94) informe sur l'issue de secours la plus proche; dans les tunnels, il est placé sur la paroi au moins tous les 50 m à une hauteur de 1 à 1,5 m au-dessus de la chaussée."
  trecho_completo: true
  excecoes:
